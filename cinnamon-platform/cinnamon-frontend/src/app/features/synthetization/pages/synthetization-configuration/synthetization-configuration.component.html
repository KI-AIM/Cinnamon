<app-configuration-page *ngIf="configurationInfo$ | async as configInfo" [configurationInfo]="configInfo"
                        [configurationInfo]="configInfo"
                        [step]="Steps.SYNTHETIZATION"
                        [additionalConfigs]="additionalConfigs"
                        [intermediateStep]="htStep">
</app-configuration-page>

<ng-template #htStep>
    <app-ht-configuration
            [enabled]="useHyperparameterTuning"
            (enabledChange)="setHyperparameterTuning($event)"
            [htFormGroup]="htFormGroup"
            [studyDefinition]="studyDefinition">
    </app-ht-configuration>
</ng-template>
