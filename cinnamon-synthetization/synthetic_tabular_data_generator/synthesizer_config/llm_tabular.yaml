name: llm_tabular
version: "0.1"
type: cross-sectional
display_name: LLM Structured Tabular Synthesis
description: Generate structured-only synthetic tabular rows with an LLM from statistical column profiles calculated on a configurable sample of the input dataset.
URL: /start_synthetization_process/llm_tabular
processing_capabilities:
  data_modality: structured_only
configurations:
  llm_profile:
    display_name: LLM Profile
    description: Select which configured LLM instance should be used.
    parameters:
      - name: llm_profile
        type: string
        label: LLM Profile
        description: Select the configured LLM profile.
        default_value: ""
        values: []
        mandatory: true
  model_parameter:
    display_name: Statistical Profile Parameters
    description: Configure how many input rows are sampled to calculate the statistical column profiles used in the prompt.
    parameters:
      - name: profile_rows
        type: integer
        label: Profile Rows
        description: Number of input rows used for profile calculation. Values above the available dataset size are automatically capped at the dataset size.
        default_value: $dataset.original.numberRows
        min_value: 1
        max_value: 1000000
  model_fitting:
    display_name: Prompt Configuration
    description: Configure optional domain context for structured row generation.
    parameters:
      - name: user_prompt_domain_context
        type: string
        multiline: true
        rows: 5
        label: Domain Context
        description: Optional context used to guide plausible relationships between structured columns.
        default_value: ""
        mandatory: false
  sampling:
    display_name: Sampling
    description: Configure the number of generated rows and LLM decoding behavior.
    parameters:
      - name: num_samples
        type: integer
        label: Number of Samples
        description: Number of structured synthetic rows to generate.
        default_value: $dataset.original.numberRows
        min_value: 1
        max_value: 1000000
      - name: temperature
        type: float
        label: Temperature
        description: Controls randomness of token sampling.
        default_value: 0.7
        min_value: 0.0
        max_value: 2.0
      - name: top_p
        type: float
        label: Top-p
        description: Controls nucleus sampling by limiting candidate tokens to a probability mass.
        default_value: 0.9
        min_value: 0.0
        max_value: 1.0
