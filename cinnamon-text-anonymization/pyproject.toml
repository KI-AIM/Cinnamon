[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinnamon-text-anonymization"
version = "0.1.0"
description = "Text anonymization service for Cinnamon"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.0",
    "gunicorn==22.0.0",
    "requests==2.32.3",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pyyaml==6.0.1",
    "transformers==4.46.3",
    "torch==2.2.2",
    "huggingface_hub==0.26.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.9.10",
    "mypy==1.15.0",
    "types-PyYAML==6.0.12.20241230",
    "types-requests==2.32.0.20250306",
]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cinnamon_text_anonymization*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["cinnamon_text_anonymization"]

[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true
files = ["app.py", "cinnamon_text_anonymization"]
exclude = ["tests/"]
ignore_missing_imports = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
