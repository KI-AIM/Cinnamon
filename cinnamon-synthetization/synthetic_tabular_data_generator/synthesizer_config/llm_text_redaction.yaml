name: llm_text_de_identification
version: "0.1"
type: cross-sectional
display_name: LLM Text Redaction
description: Redact only user-configured identifier categories from TEXT fields using a large language model.
URL: /start_synthetization_process/llm_text_de_identification
configurations:
  model_fitting:
    display_name: Prompt Configuration
    description: Define the system prompt and optional domain context used for rule-based text redaction.
    parameters:
      - name: system_prompt
        type: string
        label: System Prompt
        description: Global instruction that defines the overall role and behavior of the model. Use this to tell the model that it should only redact identifier categories that are explicitly configured via redaction rules and leave all other text unchanged.
        default_value: "You are a text redaction assistant. Replace only text spans that match configured redaction rules. Keep all other content unchanged and return only the redacted text."
        mandatory: false
      - name: user_prompt_domain_context
        type: string
        label: Domain Context
        description: Provide domain-specific context that helps the model interpret the text correctly, for example discharge summaries, physician letters, nursing notes, radiology reports, pathology reports, operative reports, emergency department notes, or other medical free-text documents.
        default_value: ""
        mandatory: false
  sampling:
    display_name: Sampling
    description: Configure generation and decoding behavior of the language model.
    parameters:
      - name: temperature
        type: float
        label: Temperature
        description: Controls how deterministic the generation is. Lower values produce more consistent outputs, which is usually preferable for rule-based redaction tasks.
        default_value: 0.0
        min_value: 0.0
        max_value: 2.0
      - name: top_p
        type: float
        label: Top-p
        description: Controls nucleus sampling by limiting token selection to the most likely candidates whose cumulative probability reaches this value.
        default_value: 1.0
        min_value: 0.0
        max_value: 1.0
      - name: max_tokens
        type: integer
        label: Max Tokens
        description: Maximum number of output tokens generated by the model for one response.
        default_value: 4096
        min_value: 1
        max_value: 32768
