name: llm_text_synthesis
version: "0.1"
type: cross-sectional
display_name: LLM Text Synthesis with Structured Consistency
description: Generate TEXT fields for synthetic tabular rows using original data as semantic context and allow minimal structured corrections when combinations are implausible.
URL: /start_synthetization_process/llm_text_synthesis
processing_capabilities:
  supports_structured_data: false
  supports_free_text_data: true
configurations:
  model_parameter:
    display_name: Dataset Generation Parameters
    description: Configure how many original rows are profiled and how many examples are used as semantic guidance for text generation.
    parameters:
      - name: profile_rows
        type: integer
        label: Profile Rows
        description: Maximum number of original rows used to estimate prompt statistics and plausibility bounds.
        default_value: 1000
        min_value: 1
        max_value: 100000
      - name: few_shot_rows
        type: integer
        label: Example Rows
        description: Number of original rows included as semantic examples in the prompt.
        default_value: 20
        min_value: 0
        max_value: 200
  model_fitting:
    display_name: Prompt Configuration
    description: Configure domain context and whether structured values may be minimally corrected for consistency.
    parameters:
      - name: user_prompt_domain_context
        type: string
        multiline: true
        rows: 5
        label: Domain Context
        description: Optional domain context to guide realistic text generation, for example clinical notes, registry data, or claims narratives.
        default_value: ""
        mandatory: false
      - name: allow_structured_corrections
        type: string
        label: Allow Structured Corrections
        description: If true, the model may minimally adjust non-TEXT values when combinations are implausible.
        default_value: "true"
        values: ["true", "false"]
  sampling:
    display_name: Sampling
    description: Configure LLM decoding behavior. The number of processed rows is always derived from the input dataset.
    parameters:
      - name: temperature
        type: float
        label: Temperature
        description: Controls randomness of token sampling. Lower values are more deterministic.
        default_value: 0.3
        min_value: 0.0
        max_value: 2.0
      - name: top_p
        type: float
        label: Top-p
        description: Controls nucleus sampling by limiting candidate tokens to a probability mass.
        default_value: 0.9
        min_value: 0.0
        max_value: 1.0

