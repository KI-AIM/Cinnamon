name: llm_knowledge_grounded_text_synthesis
version: "0.1"
type: cross-sectional
display_name: LLM Knowledge-grounded Text Synthesis
description: Generate synthetic medical free-text fields using an LLM grounded with external or local medical knowledge sources such as ICD, SNOMED CT, UMLS, ontologies, taxonomies, guidelines, or local terminologies. This is a prompt-based retrieval- or knowledge-grounded method without fine-tuning.
URL: /start_synthetization_process/llm_knowledge_grounded_text_synthesis
processing_capabilities:
  supports_structured_data: false
  supports_free_text_data: true
configurations:
  llm_profile:
    display_name: LLM Profile
    description: Select which configured LLM instance should be used.
    parameters:
      - name: llm_profile
        type: string
        label: LLM Profile
        description: Select the configured LLM profile (model endpoint and credentials).
        default_value: ""
        values: []
        mandatory: false
  model_parameter:
    display_name: Knowledge Grounding Parameters
    description: Configure how much source data is profiled and which medical knowledge source should be used for grounding.
    parameters:
      - name: profile_rows
        type: integer
        label: Profile Rows
        description: Maximum number of original rows used to estimate prompt statistics and reference characteristics.
        default_value: 1000
        min_value: 1
        max_value: 100000
      - name: few_shot_rows
        type: integer
        label: Example Rows
        description: Number of original rows included as semantic examples in the prompt.
        default_value: 20
        min_value: 0
        max_value: 200
      - name: knowledge_source_type
        type: string
        label: Knowledge Source Type
        description: Type of medical knowledge source used to ground the LLM prompt.
        default_value: none
        values: ["none", "ontology", "taxonomy", "guideline", "local_terminology", "rag_index"]
      - name: max_knowledge_chunks
        type: integer
        label: Max Knowledge Chunks
        description: Maximum number of retrieved or selected knowledge snippets to inject into the prompt.
        default_value: 5
        min_value: 0
        max_value: 100
  model_fitting:
    display_name: Prompt Configuration
    description: Configure domain context and whether structured values may be minimally corrected for consistency.
    parameters:
      - name: user_prompt_domain_context
        type: string
        multiline: true
        rows: 5
        label: Domain Context
        description: Optional domain context to guide realistic text generation, for example clinical notes, registry data, or claims narratives.
        default_value: ""
        mandatory: false
      - name: allow_structured_corrections
        type: string
        label: Allow Structured Corrections
        description: If true, the model may minimally adjust non-TEXT values when combinations are implausible.
        default_value: "true"
        values: ["true", "false"]
  sampling:
    display_name: Sampling
    description: Configure LLM decoding behavior for knowledge-grounded text generation.
    parameters:
      - name: temperature
        type: float
        label: Temperature
        description: Controls randomness of token sampling. Lower values are more deterministic.
        default_value: 0.3
        min_value: 0.0
        max_value: 2.0
      - name: top_p
        type: float
        label: Top-p
        description: Controls nucleus sampling by limiting candidate tokens to a probability mass.
        default_value: 0.9
        min_value: 0.0
        max_value: 1.0
