[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinnamon-text-extraction"
version = "0.1.0"
description = "Instructor-based text extraction service for Cinnamon"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.0",
    "gunicorn==22.0.0",
    "instructor==1.16.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools]
py-modules = ["app"]
