cinnamon.requests-cancel-connection-timeout=1000
cinnamon.requests-cancel-response-timeout=1000

cinnamon.test.database=auto

# Every test context would otherwise load the FHIR definitions, they are created on first use instead
cinnamon.fhir.preload-transformers=false

logging.level.de.kiaim.cinnamon.platform=debug

spring.datasource.url=jdbc:postgresql://localhost:5432/cinnamon_test_db
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
