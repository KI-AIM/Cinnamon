name: dpgan
version: "0.1"
type: cross-sectional
display_name: DP-GAN (Differentially Priva GAN)
description: Is a GAN for synthesizing cross-sectional data.
URL: /start_synthetization_process/dpgan
processing_capabilities:
  supports_structured_data: true
  supports_free_text_data: false
configurations:
  model_parameter:
    display_name: Model Architecture
    description: Define the model architecture and training process.
    parameters:
      - name: number_of_layers
        type: integer
        label: Hidden Layers
        description: Number of hidden layers used in both generator and discriminator.
        default_value: 2
        min_value: 1
        max_value: 10
      - name: number_of_units_in_layers
        type: integer
        label: Hidden Units
        description: Width of hidden layers used in both generator and discriminator.
        default_value: 256
        min_value: 16
        max_value: 4096
  model_fitting:
    display_name: Training Parameters
    description: Define the parameters, that are used for training the model.
    parameters:
      - name: batch_size
        type: integer
        label: Batch Size
        description: Controls how many samples are used per training step. Lower batch sizes can increase diversity but add noise, higher batch sizes make the data more consistent but may miss subtle variations. Low values lead to longer training times.
        default_value: 128
        min_value: 1
        max_value: 1024
      - name: epochs
        type: integer
        label: Number of Epochs
        description: Fewer epochs may lead the model to learn only basic patterns, while more epochs help capture complex structures. Very high values can cause the model to memorize the training data instead of learning to generalize. Higher values lead to longer training times.
        default_value: 100
        min_value: 1
        max_value: 10000
      - name: epsilon
        type: float
        label: Epsilon
        description: Differential Privacy budget epsilon that the training is allowed to spend.
        default_value: 1.0
        min_value: 0.1
        max_value: 100.0
      - name: delta
        type: float
        label: Delta
        description: Probability that the differential privacy guarantee does not hold.
        default_value: 0.00001
        min_value: 0.00000001
        max_value: 0.01
  sampling:
    display_name: Sampling
    description: Define the sampling parameters, that are used for generating the synthetic data.
    parameters:
      - name: num_samples
        type: integer
        label: Samples
        description: The number of synthetic data samples to generate. A high number of samples will increase the time required for sampling.
        default_value: $dataset.original.numberRows
        min_value: 1
        max_value: 1000000