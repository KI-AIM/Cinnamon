@if (pageData$ | async) {

    <div class="vertical-boxes">

        <div class="box">

            <div class="box-header box-header-expanded">
                <span class="box-header-icon icon-enabled"><mat-icon>gavel</mat-icon></span>
                <span class="box-header-title">Imprint</span>
            </div>

            <div class="config-input-row no-wrap">
                <div class="config-input-row-label-inline">
                    <div class="config-input-row-label-inline-header">Imprint</div>
                    <div class="config-input-row-label-inline-info">Content of the imprint popup.</div>
                </div>
                <mat-form-field class="config-input-row-field">
                    <textarea matInput rows="10" [formControl]="imprintFormControl"
                              placeholder="Content of the imprint">
                    </textarea>
                </mat-form-field>
                <div class="config-input-row-button input-height">
                    <span title="Reset" class="icon-enabled" (click)="resetImprint();">
                        <mat-icon fontIcon="replay"></mat-icon>
                    </span>
                </div>
                <div class="config-input-row-button input-height">
                    <button mat-raised-button color="primary" [disabled]="!imprintFormControl.dirty"
                            (click)="saveImprint();">
                        Save
                    </button>
                </div>
            </div>

        </div>
    </div>
}
