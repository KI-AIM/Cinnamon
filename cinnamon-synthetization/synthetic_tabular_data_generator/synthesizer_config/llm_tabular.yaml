name: llm_tabular
version: "0.1"
type: cross-sectional
display_name: LLM Dataset Generator
description: Generate fully synthetic datasets from existing source data using a configurable Ollama or OpenAI-compatible language model.
URL: /start_synthetization_process/llm_tabular
processing_capabilities:
  supports_structured_data: true
  supports_free_text_data: true
configurations:
  llm_profile:
    display_name: LLM Profile
    description: Select which configured LLM instance should be used.
    parameters:
      - name: llm_profile
        type: string
        label: LLM Profile
        description: Select the configured LLM profile (model endpoint and credentials).
        default_value: ""
        values: []
        mandatory: false
  model_parameter:
    display_name: Dataset Generation Parameters
    description: Configure how the input dataset is summarized and how example rows are selected to guide prompt construction.
    parameters:
      - name: profile_rows
        type: integer
        label: Profile Rows
        description: Maximum number of real rows used to estimate prompt statistics.
        default_value: 1000
        min_value: 1
        max_value: 100000
      - name: few_shot_rows
        type: integer
        label: Example Rows
        description: Number of real rows included as non-copyable structure examples in the prompt.
        default_value: 20
        min_value: 0
        max_value: 200
  model_fitting:
    display_name: Prompt Configuration
    description: Configure how the input dataset is summarized and how example rows are selected to guide prompt construction.
    parameters:
      - name: user_prompt_domain_context
        type: string
        multiline: true
        rows: 5
        label: Domain Context
        description: Optional domain-specific context that helps the model better interpret the dataset semantics, for example clinical documentation, claims data, lab records, registries, or other specialized tabular domains.
        default_value: ""
        mandatory: false
  sampling:
    display_name: Sampling
    description: Configure row count and decoding behavior of the language model.
    parameters:
      - name: num_samples
        type: integer
        label: Number of Samples
        description: Number of synthetic rows to generate.
        default_value: 1000
        min_value: 1
        max_value: 1000000
      - name: temperature
        type: float
        label: Temperature
        description: Controls randomness of token sampling. Lower values are more deterministic.
        default_value: 0.3
        min_value: 0.0
        max_value: 2.0
      - name: top_p
        type: float
        label: Top-p
        description: Controls nucleus sampling by limiting candidate tokens to the smallest probability mass.
        default_value: 0.9
        min_value: 0.0
        max_value: 1.0

