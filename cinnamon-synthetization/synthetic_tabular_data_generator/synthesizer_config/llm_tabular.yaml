name: llm_tabular
version: "0.1"
type: cross-sectional
display_name: LLM Dataset Generator
description: Generate fully synthetic datasets from existing source data using a configurable Ollama or OpenAI-compatible language model.
URL: /start_synthetization_process/llm_tabular
configurations:
  model_parameter:
    display_name: Dataset Generation Parameters
    description: Configure how the input dataset is summarized and how example rows are selected to guide prompt construction.
    parameters: 
      - name: profile_rows
        type: integer
        label: Profile Rows
        description: Maximum number of real rows used to estimate prompt statistics.
        default_value: 1000
        min_value: 1
        max_value: 100000
      - name: few_shot_rows
        type: integer
        label: Example Rows
        description: Number of real rows included as non-copyable structure examples in the prompt.
        default_value: 20
        min_value: 0
        max_value: 200
  model_fitting:
    display_name: Prompt Configuration
    description: Configure how the input dataset is summarized and how example rows are selected to guide prompt construction.
    parameters: []

  sampling:
    display_name: Sampling
    description: Configure dataset size and decoding behavior of the language model.
    parameters:
      - name: temperature
        type: float
        label: Temperature
        description: Controls how deterministic the generation is. Lower values produce more consistent outputs, while higher values allow more variation.
        default_value: 0.3
        min_value: 0.0
        max_value: 2.0
      - name: top_p
        type: float
        label: Top-p
        description: Controls nucleus sampling by limiting token selection to the most likely candidates whose cumulative probability reaches this value.
        default_value: 0.9
        min_value: 0.0
        max_value: 1.0
      - name: max_tokens
        type: integer
        label: Max Tokens
        description: Maximum number of output tokens generated by the model for one response.
        default_value: 1024
        min_value: 1
        max_value: 32768
      - name: num_samples
        type: integer
        label: Number of Samples
        description: Number of synthetic records to generate.
        default_value: 1000
        min_value: 1
        max_value: 1000000
