name: llm_nearest_neighbor_few_shot_text_synthesis
version: "0.1"
type: cross-sectional
display_name: LLM Nearest-neighbor Few-shot Text Synthesis
description: Generate TEXT fields for synthetic tabular rows in two sequential LLM steps. In the first step, the model optionally repairs inconsistent non-TEXT values using similar original rows as structured references. In the second step, it generates the free-text fields from the repaired row using nearest-neighbor reference texts from the original data as semantic and stylistic guidance.
URL: /start_synthetization_process/llm_nearest_neighbor_few_shot_text_synthesis
processing_capabilities:
  data_modality: mixed
  generation_scope: text_only
configurations:
  llm_profile:
    display_name: LLM Profile
    description: Select which configured LLM instance should be used.
    parameters:
      - name: llm_profile
        type: string
        label: LLM Profile
        description: Select the configured LLM profile.
        default_value: ""
        values: []
        mandatory: true
  model_parameter:
    display_name: Dataset Generation Parameters
    description: Configure how few-shot reference examples are selected for text generation.
    parameters:
      - name: few_shot_rows
        type: integer
        label: Example Rows
        description: Number of original rows injected into the prompt as few-shot reference examples.
        default_value: 20
        min_value: 0
        max_value: 200
      - name: similarity_strategy
        type: string
        label: Similarity Strategy
        description: Strategy for selecting few-shot reference rows. Random samples original rows uniformly. Attributes retrieves the nearest original rows using only non-TEXT attributes.
        default_value: Random
        values: ["Random", "Attributes"]
  model_fitting:
    display_name: Prompt Configuration
    description: Configure domain context and whether structured values may be minimally corrected for consistency.
    parameters:
      - name: user_prompt_domain_context
        type: string
        multiline: true
        rows: 5
        label: Domain Context
        description: Optional domain context to guide realistic text generation, for example clinical notes, registry data, or claims narratives.
        default_value: ""
        mandatory: false
      - name: allow_structured_corrections
        type: boolean
        label: Allow Structured Corrections
        description: If true, the model may minimally adjust non-TEXT values when combinations are implausible.
        default_value: true
  sampling:
    display_name: Sampling
    description: Configure LLM decoding behavior. The number of processed rows is always derived from the input dataset.
    parameters:
      - name: temperature
        type: float
        label: Temperature
        description: Controls randomness of token sampling. Lower values are more deterministic.
        default_value: 0.3
        min_value: 0.0
        max_value: 2.0
      - name: top_p
        type: float
        label: Top-p
        description: Controls nucleus sampling by limiting candidate tokens to a probability mass.
        default_value: 0.9
        min_value: 0.0
        max_value: 1.0
