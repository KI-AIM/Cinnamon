@if (invitations$ | async) {

    <button mat-raised-button color="primary" class="mb-2" [routerLink]="['/admin/invitation', 'new']">
        <mat-icon>add</mat-icon>
        Create Invitation
    </button>

    <mat-form-field class="w-100">
        <mat-label>Search Invitations</mat-label>
        <input #usernameFilter matInput (keyup)="applyFilterEvent($event)" placeholder="Search by username">
        @if (usernameFilter.value) {
            <mat-icon matSuffix (click)="usernameFilter.value=''; applyFilterValue('')">close</mat-icon>
        }
    </mat-form-field>

    <table mat-table matSort matSortActive="username" matSortDirection="asc" [dataSource]="dataSource"
           class="user-table">

        <!-- Real columns -->
        <ng-container matColumnDef="username">
            <th mat-header-cell mat-sort-header *matHeaderCellDef>Mail</th>
            <td mat-cell *matCellDef="let row">
                <span>{{ row.email}}</span>
            </td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let row">
                <div class="status" [ngClass]="'invite-' + row.status">
                    <span>{{ row.status.replace('_', ' ') }}</span>
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row" class="d-flex flex-row">
                <button mat-icon-button color="primary" size="small" [routerLink]="['/admin/invitation', row.id]">
                    <mat-icon>edit</mat-icon>
                </button>
            </td>
        </ng-container>

        <!-- Second header row: actual columns -->
        <tr mat-header-row *matHeaderRowDef="tableColumns"></tr>

        <!-- Data rows -->
        <tr mat-row *matRowDef="let _; columns: tableColumns;"></tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
}
