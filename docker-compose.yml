networks:
    data-management-network:
    synthetization-network:
    anonymization-network:
    evaluation-network:

services:
    cinnamon-db:
        image: postgres:16.2-alpine
        container_name: cinnamon-db
        restart: unless-stopped
        ports:
            - "127.0.0.1:5432:5432"
        networks:
            - data-management-network
        environment:
            # Has to match the datasource settings of the cinnamon-platform container
            - POSTGRES_DB=${PG_DATABASE}
            - POSTGRES_USER=${PG_USERNAME}
            - POSTGRES_PASSWORD=${PG_PASSWORD}
#        volumes:
#            - ./volumes/cinnamon-db/data:/var/lib/postgresql/data
    cinnamon-platform:
        image: ghcr.io/ki-aim/cinnamon-platform:latest
        container_name: cinnamon-platform
        restart: unless-stopped
        ports:
            - "127.0.0.1:8080:8080"
            - "127.0.0.1:9000:8000"
#        volumes:
#            - ~/.m2:/root/.m2
        networks:
            - data-management-network
            - synthetization-network
            - anonymization-network
            - evaluation-network
        environment:
            SPRING.SERVLET.MULTIPART.MAX-FILE-SIZE: ${MAX_FILE_SIZE_BYTES:-52428800}
            CINNAMON_MAX-FILE-SIZE: ${MAX_FILE_SIZE_BYTES:-52428800}

            # Initial administrator, created on startup if the user does not exist yet
            CINNAMON_ADMIN_USERNAME: ${CINNAMON_ADMIN_USERNAME:-}
            CINNAMON_ADMIN_PASSWORD: ${CINNAMON_ADMIN_PASSWORD:-}

            # Datasource has to match with the configuration of the cinnamon-db container
            SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
            SPRING_DATASOURCE_URL: jdbc:postgresql://cinnamon-db:5432/${PG_DATABASE}
            SPRING.DATASOURCE.USERNAME: ${PG_USERNAME}

            CINNAMON.CORSALLOWEDORIGINS: http://127:0:0:1,http://localhost:4200,http://127.0.0.1:8080

            CINNAMON_IS-DEMO-INSTANCE: ${IS_DEMO_INSTANCE:-false}

            # Hosts
            CINNAMON.EXTERNAL-HOST.anonymization-host.URL: http://cinnamon-anonymization
            CINNAMON.EXTERNAL-HOST.text-anonymization-host.URL: http://cinnamon-text-anonymization
            CINNAMON.EXTERNAL-HOST.synthetization-host.URL: http://cinnamon-synthetization
            CINNAMON.EXTERNAL-HOST.technical-evaluation-host.URL: http://cinnamon-evaluation
            CINNAMON.EXTERNAL-HOST.risk-assessment-host.URL: http://cinnamon-risk-assessment

            # Anonymization
            CINNAMON.EXTERNAL-SERVER.anonymization-server.CALLBACK-HOST: cinnamon-platform
            CINNAMON.EXTERNAL-SERVER.anonymization-server.INSTANCE-HOST-PORT: 8080
            CINNAMON.EXTERNAL-SERVER.anonymization-server.INSTANCES.0.HOST-NAME: anonymization-host
            # Text anonymization
            CINNAMON.EXTERNAL-SERVER.text-anonymization-server.CALLBACK-HOST: cinnamon-platform
            CINNAMON.EXTERNAL-SERVER.text-anonymization-server.INSTANCE-HOST-PORT: 5060
            CINNAMON.EXTERNAL-SERVER.text-anonymization-server.INSTANCES.0.HOST-NAME: text-anonymization-host
            # Synthetization
            CINNAMON.EXTERNAL-SERVER.synthetization-server.CALLBACK-HOST: cinnamon-platform
            CINNAMON.EXTERNAL-SERVER.synthetization-server.INSTANCES.0.HOST-NAME: synthetization-host
            # Evaluation
            CINNAMON.EXTERNAL-SERVER.technical-evaluation-server.CALLBACK-HOST: cinnamon-platform
            CINNAMON.EXTERNAL-SERVER.technical-evaluation-server.INSTANCES.0.HOST-NAME: technical-evaluation-host
            # Risk Assessment
            CINNAMON.EXTERNAL-SERVER.risk-assessment-server.CALLBACK-HOST: cinnamon-platform
            CINNAMON.EXTERNAL-SERVER.risk-assessment-server.INSTANCES.0.HOST-NAME: risk-assessment-host
        depends_on:
            - cinnamon-db
        healthcheck:
            test: "curl --fail --silent localhost:8080/actuator/health | grep UP || exit 1"
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 20s
    cinnamon-synthetization:
        image: ghcr.io/ki-aim/cinnamon-synthetization:latest
        container_name: cinnamon-synthetization
        restart: unless-stopped
        ports:
            - "127.0.0.1:5000:5000"
        networks:
            - synthetization-network
        env_file:
            - .env
        environment:
            CINNAMON_LLM_PROVIDER: ${CINNAMON_LLM_PROVIDER:-}
            CINNAMON_LLM_MODEL_NAME: ${CINNAMON_LLM_MODEL_NAME:-}
            CINNAMON_LLM_BASE_URL: ${CINNAMON_LLM_BASE_URL:-}
            CINNAMON_LLM_ENDPOINT_PATH: ${CINNAMON_LLM_ENDPOINT_PATH:-}
            CINNAMON_LLM_HEALTHCHECK_PATH: ${CINNAMON_LLM_HEALTHCHECK_PATH:-}
            CINNAMON_LLM_API_KEY: ${CINNAMON_LLM_API_KEY:-}
            CINNAMON_LLM_TIMEOUT_SECONDS: ${CINNAMON_LLM_TIMEOUT_SECONDS:-120}
            CINNAMON_LLM_MAX_RETRIES: ${CINNAMON_LLM_MAX_RETRIES:-3}
            CINNAMON_LLM_VERIFY_SSL: ${CINNAMON_LLM_VERIFY_SSL:-true}
            CINNAMON_LLM_TEMPERATURE: ${CINNAMON_LLM_TEMPERATURE:-}
            CINNAMON_LLM_TOP_P: ${CINNAMON_LLM_TOP_P:-}
            CINNAMON_LLM_MAX_TOKENS: ${CINNAMON_LLM_MAX_TOKENS:-}
    cinnamon-evaluation:
        image: ghcr.io/ki-aim/cinnamon-evaluation:latest
        container_name: cinnamon-evaluation
        restart: unless-stopped
        ports:
            - "127.0.0.1:5010:5010"
        networks:
            - evaluation-network
    cinnamon-risk-assessment:
        image: ghcr.io/ki-aim/cinnamon-risk-assessment:latest
        container_name: cinnamon-risk-assessment
        restart: unless-stopped
        ports:
#            - "8000:8000"
            - "127.0.0.1:8000:8000"
        networks:
            - evaluation-network
    cinnamon-anonymization:
        image:  ghcr.io/ki-aim/cinnamon-anonymization:latest
        container_name: cinnamon-anonymization
        restart: unless-stopped
        ports:
            - "127.0.0.1:8081:8080"
            - "127.0.0.1:9001:8000"
        networks:
            - anonymization-network
        environment:
            SPRING.SERVLET.MULTIPART.MAX-FILE-SIZE: ${MAX_FILE_SIZE_BYTES:-52428800}
#        volumes:
#            - ~/.m2:/root/.m2
    cinnamon-text-anonymization:
        image: ghcr.io/ki-aim/cinnamon-text-anonymization:latest
        container_name: cinnamon-text-anonymization
        restart: unless-stopped
        ports:
            - "127.0.0.1:5060:5060"
        networks:
            - anonymization-network
        volumes:
            - ${TEXT_ANONYMIZATION_MODEL_HOST_PATH}:/app/models:${TEXT_ANONYMIZATION_MODEL_MOUNT_MODE}
            - ${TEXT_ANONYMIZATION_STATUS_HOST_PATH:-./cinnamon-text-anonymization/outputs/status}:/app/outputs/status:rw
        secrets:
            - hf_token
        environment:
            HF_TOKEN_FILE: /run/secrets/hf_token
            TEXT_ANONYMIZATION_MODEL_CACHE: /app/models
            TEXT_ANONYMIZATION_STATUS_DIR: /app/outputs/status
            TEXT_ANONYMIZATION_XLM_LOCAL_PATH: /app/models/xlm-grascco
            TEXT_ANONYMIZATION_GELECTRA_LOCAL_PATH: /app/models/gelectra-grascco
            TEXT_ANONYMIZATION_XLM_HF_REPOSITORY: ${TEXT_ANONYMIZATION_XLM_HF_REPOSITORY}
            TEXT_ANONYMIZATION_GELECTRA_HF_REPOSITORY: ${TEXT_ANONYMIZATION_GELECTRA_HF_REPOSITORY}
secrets:
    hf_token:
        file: ${HF_TOKEN_FILE}
