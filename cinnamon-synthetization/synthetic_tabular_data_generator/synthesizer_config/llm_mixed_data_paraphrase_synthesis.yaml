name: llm_mixed_data_paraphrase_synthesis
version: "0.1"
type: cross-sectional
display_name: LLM Mixed-data Paraphrase Synthesis
description: Generate text by paraphrasing reference context around synthetic structured ground truth. Every structured fact must occur in the text; structured values remain unchanged.
URL: /start_synthetization_process/llm_mixed_data_paraphrase_synthesis
processing_capabilities:
  data_modality: mixed
configurations:
  llm_profile:
    display_name: LLM Profile
    description: Select which configured LLM instance should be used.
    parameters:
      - name: llm_profile
        type: string
        label: LLM Profile
        description: Select the configured LLM profile.
        default_value: ""
        values: []
        mandatory: true
  model_parameter:
    display_name: Reference Parameters
    description: Configure the reference pool used for text style and additional context.
    parameters:
      - name: profile_rows
        type: integer
        label: Reference Rows
        description: Number of rows in the reference pool. Values above the available dataset size are capped automatically.
        default_value: ${original.dataset.numberRows}
        min_value: 1
        max_value: 1000000
  model_fitting:
    display_name: Prompt Configuration
    description: Configure optional domain context for text generation from fixed structured ground truth.
    parameters:
      - name: user_prompt_domain_context
        type: string
        multiline: true
        rows: 5
        label: Domain Context
        description: Optional domain context used for text generation.
        default_value: ""
        mandatory: false
  sampling:
    display_name: Sampling
    description: Configure LLM decoding. One text is generated for every row from the structured synthesizer.
    parameters:
      - name: temperature
        type: float
        label: Temperature
        description: Controls randomness of token sampling. Lower values are more deterministic.
        default_value: 0.2
        min_value: 0.0
        max_value: 2.0
      - name: top_p
        type: float
        label: Top-p
        description: Controls nucleus sampling by limiting candidate tokens to a probability mass.
        default_value: 0.9
        min_value: 0.0
        max_value: 1.0
